AWSTemplateFormatVersion: "2010-09-09"
Description: Maintainer-only regional publisher for Budgeted Launcher immutable releases.

Parameters:
  GitHubRepository:
    Type: String
    Default: budgetedhq/budgeted-launcher
  GitHubOidcProviderArn:
    Type: String
    Description: ARN of the account's existing token.actions.githubusercontent.com OIDC provider.
  GitHubStagingEnvironment:
    Type: String
    Default: publisher-staging
    AllowedPattern: "^[A-Za-z0-9._-]+$"
  GitHubProductionEnvironment:
    Type: String
    Default: production
    AllowedPattern: "^[A-Za-z0-9._-]+$"

Resources:
  PublisherBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "budgetedhq-budgeted-launcher-${AWS::Region}"
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: ExpirePromotionBackups
            Status: Enabled
            Prefix: promotion-backups/
            ExpirationInDays: 7
            NoncurrentVersionExpiration:
              NoncurrentDays: 1
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false

  PublisherBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref PublisherBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PublicReleaseRead
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource:
              - !Sub "${PublisherBucket.Arn}/stable/*"
              - !Sub "${PublisherBucket.Arn}/releases/*"
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt PublisherBucket.Arn
              - !Sub "${PublisherBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: false

  GitHubStagingRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "BudgetedLauncherStager-${AWS::Region}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubRepository}:environment:${GitHubStagingEnvironment}"
      Policies:
        - PolicyName: StageImmutableLauncherArtifacts
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ["s3:GetObject", "s3:PutObject"]
                Resource:
                  - !Sub "${PublisherBucket.Arn}/releases/*"
              - Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt PublisherBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix: ["releases/*"]
              - Effect: Allow
                Action: cloudformation:ValidateTemplate
                Resource: "*"

  GitHubPromotionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "BudgetedLauncherPromoter-${AWS::Region}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub "repo:${GitHubRepository}:environment:${GitHubProductionEnvironment}"
      Policies:
        - PolicyName: PromoteAndRestoreLauncherRelease
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource:
                  - !Sub "${PublisherBucket.Arn}/releases/*"
                  - !Sub "${PublisherBucket.Arn}/stable/*"
                  - !Sub "${PublisherBucket.Arn}/promotion-backups/*"
              - Effect: Allow
                Action: s3:PutObject
                Resource:
                  - !Sub "${PublisherBucket.Arn}/stable/*"
                  - !Sub "${PublisherBucket.Arn}/promotion-backups/*"
              - Effect: Allow
                Action: s3:DeleteObject
                Resource: !Sub "${PublisherBucket.Arn}/stable/*"

Outputs:
  BucketName:
    Value: !Ref PublisherBucket
  GitHubStagingRoleArn:
    Value: !GetAtt GitHubStagingRole.Arn
  GitHubPromotionRoleArn:
    Value: !GetAtt GitHubPromotionRole.Arn
